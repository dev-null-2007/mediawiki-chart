      prometheus.io/port: "9104"
    ## @param metrics.extraArgs [object] Extra args to be passed to mysqld_exporter
    ## ref: https://github.com/prometheus/mysqld_exporter/
    ## E.g.
    ## - --collect.auto_increment.columns
