*/}}

{{- if and .Values.mariadb.tls.enabled (not .Values.mariadb.tls.existingSecret) (or (not .Values.mariadb.tls.autoGenerated.enabled) (and .Values.mariadb.tls.autoGenerated.enabled (eq .Values.mariadb.tls.autoGenerated.engine "helm"))) }}
{{- $secretName := include "mariadb.tls.secretName" . }}
{{- $caValue := "" }}
{{- $certValue := "" }}
{{- $keyValue := "" }}
{{- if .Values.mariadb.tls.autoGenerated.enabled }}
  {{- $releaseNamespace := include "common.names.namespace" . }}
  {{- $clusterDomain := .Values.mariadb.clusterDomain }}
  {{- $headlessServiceName := printf "%s-headless" (include "common.names.fullname" .) | trunc 63 | trimSuffix "-" }}
  {{- $loopback := .Values.mariadb.tls.autoGenerated.loopback }}
  {{- $ipAddresses := ternary (list "127.0.0.1") nil $loopback }}
  {{- $extraSANs := .Values.mariadb.tls.autoGenerated.extraSANs | default (list) }}
  {{- $ca := genCA "mariadb-ca" 365 }}
  {{- $caValue = $ca.Cert }}
  {{- /* Cert generation */ -}}
  {{- $primaryServiceName := include "mariadb.primary.fullname" . }}
  {{- $secondaryServiceName := include "mariadb.secondary.fullname" . }}
  {{- $sans := include "common.certs.sans" (dict "namespace" $releaseNamespace "clusterDomain" $clusterDomain "serviceName" $primaryServiceName "headlessServiceName" $headlessServiceName "loopback" $loopback "extraSANs" $extraSANs) | splitList " " | uniq }}
  {{- $sans = include "common.certs.sans" (dict "namespace" $releaseNamespace "clusterDomain" $clusterDomain "serviceName" $secondaryServiceName) | splitList " " | concat $sans | uniq }}
  {{- $cert := genSignedCert $primaryServiceName $ipAddresses $sans 365 $ca }}
  {{- $certValue = $cert.Cert }}
  {{- $keyValue = $cert.Key }}
{{- else }}
  {{- $caValue = .Values.mariadb.tls.ca }}
  {{- $certValue = required "When tls.autoGenerated.enabled=false you need to provide tls.cert" .Values.mariadb.tls.cert }}
  {{- $keyValue = required "When tls.autoGenerated.enabled=false you need to provide tls.key" .Values.mariadb.tls.key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.mariadb.commonLabels "context" .) | nindent 4 }}
    app.kubernetes.io/part-of: mariadb
  {{- if .Values.mariadb.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.mariadb.commonAnnotations "context" .) | nindent 4 }}
  {{- end }}
type: kubernetes.io/tls
data:
  tls.crt: {{ include "common.secrets.lookup" (dict "secret" $secretName "key" "tls.crt" "defaultValue" $certValue "context" .) }}
  tls.key: {{ include "common.secrets.lookup" (dict "secret" $secretName "key" "tls.key" "defaultValue" $keyValue "context" .) }}
  {{- if $caValue }}
  ca.crt: {{ include "common.secrets.lookup" (dict "secret" $secretName "key" "ca.crt" "defaultValue" $caValue "context" .) }}
  {{- end }}
{{- end }}
{{- end }}
